<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Renshuu 練習 - Neon Osaka</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-particles"></div>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="dashboard-container">
        <!-- decorative sparkles / plus marks -->
        <svg class="deco plus deco-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>
        <svg class="deco spark deco-2" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
        <svg class="deco plus deco-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>
        <svg class="deco spark deco-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg>
        <svg class="deco plus deco-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>

        <header class="top-bar">
            <div class="user-profile">
                <div class="avatar-circle"><span id="userInitial">R</span></div>
                <span id="userName">Pejuang Kanji</span>
            </div>
            <div class="gem-badge">
                <div class="gem-badge-inner">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9.5 3 8 9l4 12 4-12-1.5-6"/></svg>
                    <span id="userPoints">0</span>
                </div>
            </div>
        </header>

        <div class="title-section">
            <h1 class="main-title">Renshuu<span class="kanji-title">練習</span></h1>
            <p class="subtitle">Pilih arena latihanmu</p>
        </div>

        <div class="style-toggle" id="styleToggle">
            <div class="style-toggle-glider" id="styleGlider"></div>
            <button type="button" class="active" data-style="mcq">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                Pilihan Ganda
            </button>
            <button type="button" data-style="flip">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M20 9v8a2 2 0 0 1-2 2h-2"/><path d="M20 9l-3-3m3 3-3 3"/></svg>
                Kartu Balik
            </button>
        </div>

        <div class="menu-grid" id="menuGrid">
            <button class="diamond-btn neon-cyan" data-mode="kanji-arti">
                <div class="diamond-content">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h5M4 17v2a1 1 0 0 0 1 1h5M20 7V5a1 1 0 0 0-1-1h-5M20 17v2a1 1 0 0 1-1 1h-5"/><path d="M8 12h2m4 0h2M12 9v6"/></svg>
                    <span class="btn-title">Kanji ➔ Arti</span><span class="btn-desc">Tebak Bahasa Indonesia</span>
                </div>
            </button>
            <button class="diamond-btn neon-pink" data-mode="kanji-hiragana">
                <div class="diamond-content">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10c2-4 4-6 9-6s7 2 9 6M3 14c2 4 4 6 9 6s7-2 9-6"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
                    <span class="btn-title">Kanji ➔ Baca</span><span class="btn-desc">Tebak Hiragana</span>
                </div>
            </button>
            <button class="diamond-btn neon-purple" data-mode="hiragana-arti">
                <div class="diamond-content">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h5"/></svg>
                    <span class="btn-title">Baca ➔ Arti</span><span class="btn-desc">Dari Hiragana ke ID</span>
                </div>
            </button>
            <button class="diamond-btn neon-teal size-sm" id="btnOpenDictionary">
                <div class="diamond-content">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18M8 8h8M8 13h5"/></svg>
                    <span class="btn-title">Kamus</span><span class="btn-desc">Daftar Kosakata</span>
                </div>
            </button>
        </div>
    </div>

    <!-- MODAL KAMUS KOSAKATA (DIPERBARUI) -->
    <div id="dictionaryModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Kamus Kosakata</h2>
                <button id="btnCloseDictionary" class="exit-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    Tutup
                </button>
            </div>
            <div class="modal-filters">
                <p>Tandai kosakata yang sudah kamu hafal agar tidak muncul di latihan.</p>
                <!-- Tombol baru untuk membuka form tambah kosakata -->
                <button id="btnOpenAddWord" class="action-btn btn-add-word">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    Tambah Kosakata Baru
                </button>
            </div>
            <div id="dictionaryList" class="dictionary-list">
                <p style="text-align: center;">Memuat data...</p>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH KOSAKATA BARU (FITUR BARU) -->
    <div id="addWordModal" class="modal-overlay" style="display: none;">
        <div class="modal-content form-modal">
            <div class="modal-header">
                <h2>Tambah Kosakata</h2>
                <button id="btnCloseAddWord" class="exit-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    Batal
                </button>
            </div>
            <div class="form-container">
                <div class="input-group">
                    <label for="inputKanji" class="label-kanji">Kanji / Kata (Opsional)</label>
                    <input type="text" id="inputKanji" class="custom-input" placeholder="Contoh: 食べる">
                </div>
                <div class="input-group">
                    <label for="inputHiragana" class="label-hiragana">Hiragana / Cara Baca (Wajib)</label>
                    <input type="text" id="inputHiragana" class="custom-input" placeholder="Contoh: たべる">
                </div>
                <div class="input-group">
                    <label for="inputArti" class="label-arti">Arti (Wajib)</label>
                    <input type="text" id="inputArti" class="custom-input" placeholder="Contoh: Makan">
                </div>
                <p id="formFeedback" style="color: var(--neon-red); font-size: 0.8rem; text-align: center; display: none; margin-top: -5px;">Harap isi Hiragana dan Arti!</p>
                <button id="btnSaveWord" class="action-btn btn-save">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                    Simpan Kosakata
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="menu.js"></script>
</body>
</html>
